<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>EcoTins - Solicitar Coleta</title>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="{{ url_for('static', filename='assets/logo_ecotins.png') }}" alt="EcoTins Logo">
        </div>
        <nav>
            <a href="/" class="nav-btn">INÍCIO</a>
            <a href="/solicitar" class="nav-btn">SOLICITAR COLETA</a>
            <a href="/pontos" class="nav-btn">PONTOS DE COLETA</a>
            <a href="/solicitacoes" class="nav-btn">MINHAS SOLICITAÇÕES</a>
            <a href="/sair" class="nav-btn">SAIR</a>
        </nav>
    </header>

    <main class="container">
        <div class="banner" style="flex-direction: column; align-items: center; text-align: left; max-width: 500px; padding: 40px 30px;">
            <h2 style="margin-bottom: 5px; width: 100%; text-align: center;">Solicitar Nova Coleta</h2>
            <p style="color: #718096; margin-bottom: 30px; font-size: 15px; width: 100%; text-align: center;">
                Preencha os dados abaixo para agendar a retirada
            </p>
            
            <form action="/solicitar" method="POST" style="width: 100%;">
                <div class="form-group">
                    <label for="tipo">Tipo de Resíduo</label>
                    <select id="tipo" name="tipo" class="form-input-custom" required>
                        <option value="Plástico">Plástico</option>
                        <option value="Papel/Papelão">Papel / Papelão</option>
                        <option value="Eletroeletrônicos">Eletroeletrônicos</option>
                        <option value="Pilhas/Baterias">Pilhas / Baterias</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição dos Materiais</label>
                    <textarea id="descricao" name="descricao" class="form-input-custom" rows="4" placeholder="Ex: 3 sacos de garrafas PET, 1 monitor antigo CRT quebrados..." required></textarea>
                </div>

                <button type="submit" class="btn-login-submit">Enviar Solicitação</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>EcoTins | Contato: (63) 992 999 999</p>
    </footer>

</body>
</html>
